# This is a basic workflow to help you get started with Actions

name: Build ISO

# Controls when the workflow will run
on:
  # Manual only
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
          contents: write
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Free up disk space
        # Building an ISO requires significant disk space. 
        # This step removes unused large pre-installed tools on the GitHub runner.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools debian-archive-keyring
      - name: Build the ISO
        run: |
          cd iso-build
          # Requires root privileges to create the chroot and squashfs
          sudo lb build
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidstall-kde-iso
          path: iso-build/*.iso
          retention-days: 7
      - name: Generate Release
        uses: softprops/action-gh-release@v3
        with:
          files: sidstall-kde-iso.iso
          body: |
            Weekly GH Actions build
